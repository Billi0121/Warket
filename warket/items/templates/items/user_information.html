{% extends 'items/index.html' %}

{% block content %}
<div class="max-w-6xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4 text-black">User: {{ user }}</h1>
    <h2 class="text-2xl font-bold mb-4 text-black">{{ user }} Items</2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        {% for item in items %}
            <div class="bg-gray-800 rounded-xl shadow-md overflow-hidden border border-gray-700 hover:shadow-lg transition duration-300">
                <a href="{% url 'product_detail' item.id %}"><img src="{{ item.image.url }}" alt="Item Image" class="w-full h-48 object-cover"></a>
                <div class="p-4">
                    <p class="text-lg font-semibold text-white">{{ item }}</p>
                </div>
            </div>
        {% empty %}
            <p class="text-gray-400">No items found.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
