{% extends 'items/index.html' %}

{% block content %}
<div class="max-w-6xl mx-auto mt-10 bg-white rounded-xl shadow-md overflow-hidden">
    <div class="flex flex-col md:flex-row">
        
        <!-- Левая часть — изображение -->
        <div class="md:w-1/2 h-96">
            <img src="{{ product.image.url }}" alt="Product Image" class="w-full h-full object-cover">
        </div>

        <!-- Правая часть — информация -->
        <div class="md:w-1/2 p-8 flex flex-col justify-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-4">{{ product.item }}</h1>
            
            <p class="text-2xl text-green-600 font-semibold mb-4">
                {{ product.price }} {{ product.currency }}
            </p>
            
            <p class="text-gray-700 mb-6">
                {{ product.description }}
            </p>

            <div class="text-sm text-gray-500">
                Владелец: {{ product.owner }}
            </div>
        </div>
        <form method='post'>
            {% csrf_token %}
            <button>Add to cart
        <form>
        
    </div>
</div>
{% endblock %}
