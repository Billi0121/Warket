
version: '3.8'

services:
  db:
    image: postgres:16.9-alpine
    volumes: 
      - /var/lib/postgresql/data/
    env_file: 
      - ./.env 

  web:
    build: .
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    volumes: 
      - /var/lib/postgresql/data/
    