
services:

  web:
    build: .
    restart: always
    expose:
      - "8000"
    depends_on:
      - db
    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/
      
  nginx:
    restart: always
    image: nginx:1.24
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  static_volume:
  media_volume: